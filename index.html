<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Ricerca CER</title>
<style>
:root{--bg:#eaf0f2;--sf:#fff;--ink:#12242c;--mut:#5b6f78;--ln:#d3dde1;--ac:#0b6577;--acf:#fff;--hz:#b42318;--hzb:#fde7e4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1f;--sf:#17272e;--ink:#e6eef1;--mut:#93a8b1;--ln:#2a3f48;--ac:#5cc3d6;--acf:#06222a;--hz:#ff8a7d;--hzb:#3a1f1c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1a1f;--sf:#17272e;--ink:#e6eef1;--mut:#93a8b1;--ln:#2a3f48;--ac:#5cc3d6;--acf:#06222a;--hz:#ff8a7d;--hzb:#3a1f1c;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;padding-bottom:66px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--ln)}
.box{display:flex;gap:8px}
#q{flex:1;min-width:0;font:inherit;font-size:19px;padding:13px 14px;border-radius:14px;border:2px solid var(--ln);background:var(--sf);color:var(--ink);outline:none}
#q:focus{border-color:var(--ac)}
#x{border:0;border-radius:14px;padding:0 16px;font:inherit;background:var(--sf);color:var(--mut);border:2px solid var(--ln)}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;font:inherit;font-size:15px;padding:7px 14px;border-radius:99px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--acf)}
.chip.hz[aria-pressed=true]{background:var(--hz);border-color:var(--hz);color:var(--bg)}
main{padding:10px 14px 40px;max-width:720px;margin:0 auto}
#info{color:var(--mut);font-size:14px;margin:6px 2px 10px}
.it{cursor:pointer;display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--ln);border-radius:12px;padding:11px 14px;margin:0 0 8px}
.it.h{border-left-color:var(--hz)}
.cd{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.03em}
.hb{margin-left:8px;font-size:13px;font-weight:600;color:var(--hz);background:var(--hzb);padding:2px 8px;border-radius:99px;letter-spacing:0;vertical-align:3px}
.ds{margin-top:2px;overflow-wrap:anywhere}
.dt{display:none;margin-top:10px;padding-top:10px;border-top:1px dashed var(--ln);font-size:14px;color:var(--mut)}
.it.o .dt{display:block}
.dt b{color:var(--ink);font-weight:600}
.cp{margin:10px 8px 0 0;font:inherit;font-size:15px;padding:8px 14px;border-radius:10px;border:0;background:var(--ac);color:var(--acf)}
.cp.add{background:none;box-shadow:inset 0 0 0 1.5px var(--ac);color:var(--ac)}
.cp.add.on{background:var(--hz);box-shadow:none;color:#fff}
.ch .cd{font-size:19px}
.more{width:100%;padding:12px;font:inherit;border-radius:12px;border:1.5px solid var(--ac);background:none;color:var(--ac)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

/* barra di navigazione */
#fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:8px;font:inherit;font-size:17px;font-weight:600;padding:13px 22px;border:0;border-radius:99px;background:var(--ac);color:var(--acf);box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap}
#fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#vS main{padding-bottom:96px}
.dlg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.dlgb{background:var(--sf);color:var(--ink);border-radius:16px;padding:16px;width:100%;max-width:520px;max-height:82vh;overflow:auto}
.dlgb h3{margin:0 0 6px;font-size:19px}
.dlgb p{margin:0 0 4px;overflow-wrap:anywhere}
.dlga{display:grid;gap:8px;margin-top:14px}
.mw{background:var(--hzb);color:var(--hz);border-bottom:1px solid var(--hz);padding:10px 14px;font-size:14px}

/* banner aggiunta */
.tg{margin-top:10px;background:var(--hz);color:#fff;border-radius:12px;padding:9px 12px;display:flex;align-items:center;gap:10px;font-size:15px}
.tg span{flex:1;min-width:0;overflow-wrap:anywhere}
.tgb{display:block;width:100%;margin-top:8px;font:inherit;font-size:15px;padding:9px 12px;border-radius:12px;border:1.5px dashed var(--hz);background:var(--sf);color:var(--hz)}
.cp.use{background:var(--hz);color:#fff;font-weight:600}
.tg button{font:inherit;font-size:14px;background:#fff;color:var(--hz);border:0;border-radius:8px;padding:6px 10px;flex:none}

/* sopralluoghi */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--ln);min-height:56px}
.top h1{margin:0;font-size:24px}
.bk{font:inherit;background:none;border:0;color:var(--ac);padding:6px 0;font-size:17px}
.sv{font-size:13px;color:var(--mut)}
#et,.lt{font-size:24px;margin:6px 2px 12px;overflow-wrap:anywhere}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.cnt{font-size:13px;background:var(--bg);color:var(--mut);padding:1px 9px;border-radius:99px;font-weight:600}
.cnt:empty{display:none}
.cdb{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted var(--mut);text-underline-offset:5px;cursor:pointer}
.cr.nc{border-style:dashed;border-left-style:solid;border-left-color:var(--ac)}
.na{font-size:18px;font-weight:700;color:var(--ac)}
.cfs .hint{font-size:13px}
.unc{border:1.5px dashed var(--hz);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.unc h3{margin:0;font-size:16px;color:var(--hz);display:flex;align-items:center;gap:8px}
.lnk{color:var(--ac);text-decoration:underline;cursor:pointer;white-space:nowrap}
.opn{white-space:nowrap;flex:none;margin-left:auto;font:inherit;font-size:15px;font-weight:600;background:none;border:1.5px solid var(--ac);color:var(--ac);border-radius:99px;padding:4px 12px;cursor:pointer}
.opn.cc{margin:0;flex:none;align-self:center}
.lt .cnt{font-size:15px;vertical-align:4px}
.grid.g2{grid-template-columns:repeat(2,1fr);gap:8px}
.fl{display:block;font-size:14px;color:var(--mut);margin:0 0 10px;min-width:0}
.fl select,.fl input,.fl textarea,.qr input,.qr select,.nt,#ovn{display:block;width:100%;min-width:0;margin-top:4px;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1.5px solid var(--ln);border-radius:10px;padding:10px 12px;outline:none}
.fl input:focus,.fl textarea:focus,.qr input:focus,.qr select:focus,.nt:focus,#ovn:focus{border-color:var(--ac)}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:47px}
textarea{resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:16px;padding:11px 10px;border-radius:12px;border:1.5px solid var(--ac);background:none;color:var(--ac);text-align:center;cursor:pointer}
.btn.pri{background:var(--ac);color:var(--acf)}
.btn.dng{border-color:var(--hz);color:var(--hz)}
.btn:disabled{opacity:.6}
.wide{width:100%;margin-top:10px}
.big{padding:14px;font-size:18px;margin:4px 0 14px}
#gpsb{width:100%;margin-bottom:10px}
.hint{font-size:14px;color:var(--mut);margin:4px 2px}
.hint a{color:var(--ac)}
.err{color:var(--hz)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.grid:empty{display:none}
.th{position:relative;padding:0;border:0;border-radius:10px;overflow:hidden;aspect-ratio:1/1;background:var(--bg)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th span,.th i{position:absolute;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-style:normal;padding:1px 7px;border-radius:99px}
.th span{left:4px;top:4px}.th i{right:4px;top:4px}
.th b{position:absolute;left:4px;right:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.th b.no{background:var(--hz)}
.cfr{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.cfr .btn.sm2.pri{flex:1}
.cfs{order:2;flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;min-width:0;align-items:center}
.cfs:empty{display:none}
.cfs .hint{margin:0;font-size:13px}
.mt{position:relative;flex:none;width:52px;height:52px;padding:0;border:0;border-radius:8px;overflow:hidden;background:var(--bg)}
.mt img{width:100%;height:100%;object-fit:cover;display:block}
.mt span{position:absolute;left:2px;top:2px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:0 5px;border-radius:99px}
.btn.sm2{flex:none;padding:8px 10px;font-size:15px}
.ovh{color:#fff;font-size:15px;font-weight:600}
.ovmv{font:inherit;font-size:14px;background:none;border:0;color:#cfe;text-decoration:underline;padding:2px 0;align-self:flex-start}
.ovk{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ovk .lb{color:#ddd;font-size:14px;width:100%}
.ovk button{font:inherit;font-size:15px;font-weight:600;padding:7px 12px;border-radius:99px;border:1.5px solid #fff;background:none;color:#fff;font-variant-numeric:tabular-nums}
.ovk button[aria-pressed=true]{background:#fff;color:#0b6577}
.ovk button.h[aria-pressed=true]{color:#b42318}
.ovk button.ovs{border-style:dashed}
.cr{border:1px solid var(--ln);border-left:6px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.cr.h{border-left-color:var(--hz)}
.crh{display:flex;align-items:center}
.crh .cd{font-size:19px}
.xb{margin-left:auto;font:inherit;background:none;border:0;color:var(--mut);font-size:18px;padding:2px 6px}
.sm{font-size:14px}
.qr{display:grid;grid-template-columns:1fr 100px;gap:8px;margin-top:10px}
.qr input,.qr select{margin-top:0}
.nt{margin-top:8px!important;font-size:16px!important}
.tot{margin-top:12px;font-size:15px}
.tot:empty{display:none}
.sl{padding:13px 14px}
.slt{font-size:19px;font-weight:700;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--mut);margin-top:4px}
#ov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.9);display:flex;flex-direction:column;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
#ovi{width:100%;height:100%;object-fit:contain;display:block}
.ovw{position:relative;flex:1;min-height:0;touch-action:pan-y}
.ova{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:12px;background:rgba(0,0,0,.45);color:#fff;font-size:34px;line-height:1}
.ova.l{left:0}.ova.r{right:0}
#ovn{background:var(--sf);margin:0}
#ov .btn.dng{background:var(--sf)}

/* report */
#vR{background:#d9dee0;min-height:100vh}
#vR .top{background:#d9dee0;border-color:#c3cacd}
#vR .bk{color:#0b6577}
.rep{background:#fff;color:#111;max-width:800px;margin:12px auto 30px;padding:22px 20px;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.rep h1{font-size:22px;margin:0 0 4px}
.rep h2{font-size:17px;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid #0b6577}
.rep .sub{color:#555;font-size:13px;margin:0 0 14px}
.rep table{width:100%;border-collapse:collapse}
.rep .kv th{text-align:left;width:32%;vertical-align:top;color:#555;font-weight:600;padding:5px 10px 5px 0}
.rep .kv td{padding:5px 0;overflow-wrap:anywhere}
.rep .tb th,.rep .tb td{border-bottom:1px solid #ccc;padding:6px 5px;text-align:left;vertical-align:top}
.rep .tb th{font-size:13px;color:#555}
.rep .r{text-align:right}.rep .nw{white-space:nowrap}
.rep .pg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rep figure{margin:0;break-inside:avoid;page-break-inside:avoid}
.rep figure img{width:100%;max-height:9cm;object-fit:contain;background:#f0f0f0;display:block}
.rep figcaption{font-size:13px;color:#444;margin-top:3px}
.rep a{color:#0b6577}
@page{margin:14mm}
@media print{
 .np,#fab,#mw,#dlg,#vS,#vL,#vE,#vG,#ov{display:none!important}
 :root{padding:0}
 body,#vR{background:#fff;padding:0;min-height:0}
 body::before{display:none}
 .rep{margin:0;padding:0;max-width:none;box-shadow:none}
}
</style>

function search(){
  const raw=$('q').value.trim();
  let res=R;
  if(chap)res=res.filter(r=>r[0].startsWith(chap));
  if(flt=='h')res=res.filter(r=>r[2]);else if(flt=='n')res=res.filter(r=>!r[2]);
  return findCodes(raw,res);
}
function findCodes(raw,res){
  res=res||R;
  if(!raw)return res;
  if(/^[\d\s.*]+$/.test(raw)&&/\d/.test(raw)){
    const d=raw.replace(/\D/g,'');
    const a=res.filter(r=>r[0].startsWith(d));
    return a.concat(d.length>=3?res.filter(r=>!r[0].startsWith(d)&&r[0].includes(d)):[]);
  }
  const tk=nz(raw).split(/\s+/);
  return res.filter(r=>tk.every(t=>r[3].includes(t)));
}

let dbp,MEM=null;
function idb(){return dbp||(dbp=new Promise((ok,ko)=>{
  const to=setTimeout(()=>ko(new Error('timeout')),4000);
  try{const q=indexedDB.open('cer-sopralluoghi',1);q.onupgradeneeded=()=>{const d=q.result;d.createObjectStore('sop',{keyPath:'id'});d.createObjectStore('foto',{keyPath:'id'}).createIndex('sop','sop')};q.onsuccess=()=>{clearTimeout(to);ok(q.result)};q.onerror=()=>{clearTimeout(to);ko(q.error)}}
  catch(e){clearTimeout(to);ko(e)}
}))}
/* se il browser blocca l'archivio (anteprime, finestre private) l'app funziona lo stesso, ma senza salvare */
function memStore(st){const m=MEM[st],R=v=>({result:v});return{put:o=>(m.set(o.id,o),R(o.id)),get:k=>R(m.get(k)),getAll:()=>R([...m.values()]),delete:k=>(m.delete(k),R()),index:()=>({getAll:id=>R([...m.values()].filter(x=>x.sop==id))})}}
async function tx(store,mode,fn){
  let d=null;
  if(!MEM){try{d=await idb()}catch(e){MEM={sop:new Map(),foto:new Map()};const w=$('mw');if(w)w.hidden=$('vS').hidden===false}}
  if(MEM){const q=fn(memStore(store));return q?q.result:undefined}
  return new Promise((ok,ko)=>{const t=d.transaction(store,mode),q=fn(t.objectStore(store));let r;if(q)q.onsuccess=()=>{r=q.result};t.oncomplete=()=>ok(r);t.onerror=()=>ko(t.error);t.onabort=()=>ko(t.error)});
}

function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},5000)}
async function esporta(name,blob){
  const dc=await dlCap();
  if(dc){try{await dc.save({filename:name,data:blob})}catch(e){if(!e||e.code!='declined')note('Non riesco a salvare il file qui. Riprova tra poco.')}return}
  try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}
  catch(e){if(e&&e.name=='AbortError')return}
  dl(name,blob);
}
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});
    const M=1600,k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    return await new Promise(ok=>c.toBlob(b=>ok(b||file),'image/jpeg',.82));
  }catch(_){return file}finally{URL.revokeObjectURL(url)}
}

function stopGps(){if(watch!=null){navigator.geolocation.clearWatch(watch.id);clearTimeout(watch.to);watch=null}}
function rileva(){
  const info=$('gpsi'),b=$('gpsb');
  if(!navigator.geolocation){info.innerHTML='<span class="err">Questo browser non dà accesso al GPS. Inserisci le coordinate a mano.</span>';return}
  if(!window.isSecureContext){info.innerHTML='<span class="err">Il GPS funziona solo se la pagina è aperta da un indirizzo https. Inserisci le coordinate a mano.</span>';return}
  stopGps();
  const s=cur;let best=null;b.disabled=true;b.textContent='Rilevo la posizione…';
  const fine=()=>{stopGps();if(cur===s){b.disabled=false;updGps()}};
  watch={};
  watch.id=navigator.geolocation.watchPosition(p=>{
    if(cur!==s)return stopGps();
    const c=p.coords;
    if(!best||c.accuracy<best){best=c.accuracy;s.gps={lat:+c.latitude.toFixed(6),lon:+c.longitude.toFixed(6),acc:Math.round(c.accuracy),alt:c.altitude!=null?Math.round(c.altitude):null,ts:Date.now()};updGps();b.disabled=true;b.textContent='Affino… ±'+Math.round(c.accuracy)+' m';save()}
    if(c.accuracy<=8)fine();
  },e=>{
    stopGps();if(cur!==s)return;b.disabled=false;updGps();
    $('gpsi').innerHTML='<span class="err">'+(inClaude?'In questa versione aperta da Claude il GPS non è disponibile. Scrivi le coordinate: in Google Maps tieni premuto sul punto e copia i numeri che compaiono.':e.code==1?'Permesso negato: abilita la posizione per questo browser nelle impostazioni del telefono.':'Posizione non disponibile. Riprova all’aperto o inserisci le coordinate a mano.')+'</span>';
  },{enableHighAccuracy:true,timeout:25000,maximumAge:0});
  watch.to=setTimeout(fine,20000);
}

/* ZIP (senza compressione: le JPEG sono già compresse) */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

async function makeZip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const d=new Date(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const data=new Uint8Array(await f.blob.arrayBuffer()),nm=enc.encode(f.name),crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,tm,true);h.setUint16(12,dt,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(h,nm,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,tm,true);c.setUint16(14,dt,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cen.push(c,nm);off+=30+nm.length+data.length;
  }
  const cs=cen.reduce((a,x)=>a+x.byteLength,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e],{type:'application/zip'});
}

  const chg=t.closest('[data-chg]');if(chg&&cur){const x=cur.cer[+chg.dataset.chg];(async()=>{const c=await pickCode(x.c?'Cambia codice CER':'Assegna codice CER');if(!c||!cur)return;x.c=c;renderCer();renderPh();save()})();return}
  const ub=t.closest('[data-use]');if(ub&&pick){pickDone(ub.dataset.use);return}
  if(t.id=='ovnew'){(async()=>{const f=ovF;const c=await pickCode('Codice CER per questa foto');if(!c||!cur||ovF!==f)return;let x=cur.cer.find(y=>y.c==c);if(!x){x=addRow(c);save();if(view=='vE')renderCer()}f.cer=f.cer||[];if(!f.cer.includes(x.id))f.cer.push(x.id);ovDirty=true;paintOvk()})();return}
  if(t.id=='csv'){flush();csv(cur);return}
  if(t.id=='zip'){flush();zipFoto(cur);return}
  const ct=t.closest('[data-cat]');
  if(ct&&ovF){const k=ct.dataset.cat;if(k!=catOf(ovF)){ovF.cat=k;delete ovF.acc;if(k!='rif')ovF.cer=[];ovDirty=true;$('ovh').textContent='Foto '+CATS.find(c=>c[0]==k)[1].toLowerCase();paintOvk()}return}
  const ok=t.closest('[data-ok]');
  if(ok&&ovF){const k=ok.dataset.ok;ovF.cer=ovF.cer||[];ovF.cer=ovF.cer.includes(k)?ovF.cer.filter(x=>x!=k):ovF.cer.concat(k);ovDirty=true;paintOvk();return}
  if(t.id=='dels'){elimina();return}
  if(t.id=='prt'){print();return}
  if(t.id=='rdl'){scaricaReport();return}
  if(t.dataset.dc!=null){const i=+t.dataset.dc,x=cur.cer[i];(async()=>{if(!await ask('Togliere la voce '+lbl(cur,x)+' da questo sopralluogo? Le sue foto restano tra quelle da classificare.','Togli',1))return;const k=cur.cer.indexOf(x);if(k<0)return;cur.cer.splice(k,1);renderCer();save();for(const p of fotos){if((p.cer||[]).includes(x.id)){p.cer=p.cer.filter(y=>y!=x.id);await put('foto',p)}}renderPh()})();return}
  const pf=t.closest('[data-pf]');if(pf){openPh(pf.dataset.pf,[...pf.parentElement.querySelectorAll('[data-pf]')].map(x=>x.dataset.pf));return}
  /* ricerca */
  if(t.dataset.add){addCer(t.dataset.add);return}
  if(t.dataset.f){flt=t.dataset.f;shown=60;sync();render();return}
  if(t.id=='cc'){chap=chap.length>2?chap.slice(0,2):'';showAll=false;shown=60;render();scrollTo(0,0);return}
  if(t.id=='allc'){showAll=true;shown=60;render();scrollTo(0,0);return}
  if(t.id=='more'){shown+=100;render();return}
  if(t.dataset.cp){
    try{navigator.clipboard.writeText(t.dataset.cp.replace('*','')).then(()=>t.textContent='Copiato')}catch(_){t.textContent='Copia non disponibile'}
    return}
  const ch=t.closest('[data-ch]');
  if(ch){chap=ch.dataset.ch;showAll=false;shown=60;render();scrollTo(0,0);return}
  const it=t.closest('[data-c]');
  if(it)it.classList.toggle('o');
});
route();
</script>
</body>
</html>
